<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="/i18n.js"></script>
  <title>Orbe</title>
  <link rel="icon" href="/logo.svg">
  <link rel="stylesheet" href="/style.css">  <script type="importmap">{"imports":{"three":"/vendor/three.module.js","three/addons/":"/vendor/"}}</script>
</head>
<body>
  <div id="stage" aria-hidden="true"></div>
  <div id="labels" aria-hidden="true"></div>

  <header id="bar">
    <a class="wordmark" href="/" title="Accueil" style="color:inherit;text-decoration:none">Orbe</a>
    <button id="back" class="ghost back" type="button" hidden>Retour</button>
    <div class="views" role="group" aria-label="Vue">
      <button id="view-focus" type="button" title="Touche 1">Dossier</button>
      <button id="view-large" type="button" title="Touche 2">Tout voir</button>    </div>
    <div class="search">
      <label class="sr" for="search">Chercher dans la carte</label>
      <input id="search" type="search" placeholder="Chercher dans la carte" autocomplete="off">
      <div id="search-results" hidden></div>
    </div>
    <button id="sound" class="ghost" type="button" title="Couper ou remettre les effets sonores">Son : activé</button>
    <a id="connect-ai" class="ghost" href="/ia" style="text-decoration:none">Connecter son IA</a>
  </header>

  <div id="legend"></div>
  <main id="panel" aria-live="off"></main>
  <div id="toast" role="status"></div>

  <dialog id="dialog"></dialog>
  <div id="no-webgl" hidden>
    <p>Orbe a besoin de WebGL pour afficher la carte en 3D. Active l'accélération matérielle dans les réglages du navigateur, puis recharge la page.</p>
  </div>
  <script type="module" src="/app.js"></script>
  <script type="module" src="/site.js"></script></body>
</html>
